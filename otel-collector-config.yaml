receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  awsxray:
    indexed_attributes:
      - session_id
      - gen_ai.request.model

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [awsxray]